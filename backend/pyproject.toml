[project]
name = "balalayka"
version = "0.1.0"
description = ""
authors = [
    {name = "Anna_Putilovskaya",email = "putilovskayaa@mail.ru"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.30,<1.0)",
    "pydantic-settings (>=2.5,<3.0)",
    "sqlalchemy[asyncio] (>=2.0.35,<2.1)",
    "asyncpg (>=0.29,<1.0)",
    "alembic (>=1.13,<2.0)",
    "redis (>=5.0,<6.0)",
    "jinja2 (>=3.1,<4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "app" }]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=8.0,<9.0)",
    "pytest-asyncio (>=0.24,<1.0)",
    "httpx (>=0.27,<1.0)",
    "ruff (>=0.6,<1.0)",
    "mypy (>=1.11,<2.0)",
    "testcontainers[postgres] (>=4.8,<5.0)",
    "psycopg2-binary (>=2.9,<3.0)"
]
